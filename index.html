<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dom.css">
    <title>Dom em JavaScript</title>
</head>
<body>
    <h1 id="titulo">Exemplos de DOM</h1>
    <p id="paragrafo">Este é o texto original do parágrafo</p>
    <div id="caixa">Essa é a caixa que vamos manipular</div>
    <ul id="lista">
        <li>Item 1</li>
    </ul>

    <p>Clique no botão <span id="contador">0</span></p>

    <button id="btnTexto">Mudar texto</button>
    <button id="btnCor">Mudar cor de texto</button>
    <button id="btnFundo">Mudar cor de fundo</button>
    <button id="btnDestaque">Alternar destaque</button>
    <button id="btnFonte">Aumentar fonte</button>
    <button id="btnAdicionar">Adicionar item</button>
    <button id="btnRemover">Remover item</button>
    <button id="btnContador">Clique aqui</button>
    <button id="btnReiniciar">Reiniciar cliques</button>
    
    <script src="script.js"></script>
</body>
</html>
